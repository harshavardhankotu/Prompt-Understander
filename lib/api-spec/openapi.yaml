openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: OmniBid India API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: categories
  - name: requirements
  - name: bids
  - name: reviews
  - name: notifications
  - name: subscriptions
  - name: dashboard
  - name: disputes
  - name: compliance
  - name: negotiations
  - name: payments

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # USERS
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{id}/update:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # CATEGORIES
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # REQUIREMENTS
  /requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      summary: List open requirements (live feed)
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
    post:
      operationId: createRequirement
      tags: [requirements]
      summary: Post a new requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementBody"
      responses:
        "201":
          description: Created requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

  /requirements/my:
    get:
      operationId: listMyRequirements
      tags: [requirements]
      summary: List requirements posted by current user
      responses:
        "200":
          description: My requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"

  /requirements/{id}:
    get:
      operationId: getRequirement
      tags: [requirements]
      summary: Get requirement detail with bids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementDetail"

  /requirements/{id}/cancel:
    post:
      operationId: cancelRequirement
      tags: [requirements]
      summary: Cancel a requirement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

  /requirements/{id}/accept-bid:
    post:
      operationId: acceptBid
      tags: [requirements]
      summary: Accept a bid and close auction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptBidBody"
      responses:
        "200":
          description: Bid accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

  # BIDS
  /requirements/{requirementId}/bids:
    get:
      operationId: listBids
      tags: [bids]
      summary: List bids for a requirement
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [lowest_price, highest_rating, fastest_start]
      responses:
        "200":
          description: Bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
    post:
      operationId: createBid
      tags: [bids]
      summary: Place a bid on a requirement
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBidBody"
      responses:
        "201":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /bids/{id}/withdraw:
    post:
      operationId: withdrawBid
      tags: [bids]
      summary: Withdraw a bid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bid withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /bids/my:
    get:
      operationId: listMyBids
      tags: [bids]
      summary: List bids placed by current provider
      responses:
        "200":
          description: My bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidWithRequirement"

  # REVIEWS
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /users/{id}/reviews:
    get:
      operationId: getUserReviews
      tags: [reviews]
      summary: Get reviews for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadBody"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # SUBSCRIPTIONS
  /subscriptions/my:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get current provider's subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSubscription"

  /subscriptions/upgrade:
    post:
      operationId: upgradeSubscription
      tags: [subscriptions]
      summary: Upgrade subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeSubscriptionBody"
      responses:
        "200":
          description: Upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSubscription"

  # DASHBOARD / WOW ENDPOINTS
  /dashboard/buyer:
    get:
      operationId: getBuyerDashboard
      tags: [dashboard]
      summary: Buyer dashboard summary
      responses:
        "200":
          description: Buyer stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerDashboard"

  /dashboard/provider:
    get:
      operationId: getProviderDashboard
      tags: [dashboard]
      summary: Provider dashboard summary
      responses:
        "200":
          description: Provider stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDashboard"

  /requirements/{id}/repost:
    post:
      operationId: repostRequirement
      tags: [requirements]
      summary: Repost a completed/expired requirement as a new auction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Reposted requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

  # DISPUTES
  /disputes:
    get:
      operationId: listDisputes
      tags: [disputes]
      summary: List disputes for current user
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispute"
    post:
      operationId: createDispute
      tags: [disputes]
      summary: Raise a dispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeBody"
      responses:
        "201":
          description: Dispute created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  /disputes/{id}/respond:
    post:
      operationId: respondToDispute
      tags: [disputes]
      summary: Respond to a dispute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondDisputeBody"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  /disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [disputes]
      summary: Resolve a dispute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDisputeBody"
      responses:
        "200":
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  /compliance/my:
    get:
      operationId: getMyCompliance
      tags: [compliance]
      summary: Get current user compliance vault
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Compliance vault (null if not yet created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceVault"
                nullable: true
    put:
      operationId: updateMyCompliance
      tags: [compliance]
      summary: Upsert compliance vault
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceBody"
      responses:
        "200":
          description: Saved compliance vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceVault"

  # NEGOTIATIONS (Bhaav-Taav)
  /requirements/{requirementId}/negotiations:
    get:
      operationId: getNegotiation
      tags: [negotiations]
      summary: Get or create negotiation thread
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
        - name: providerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Negotiation thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Negotiation"

  /requirements/{requirementId}/negotiations/message:
    post:
      operationId: sendNegotiationMessage
      tags: [negotiations]
      summary: Send a message or counter-offer in negotiation room
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNegotiationMessageBody"
      responses:
        "200":
          description: Updated negotiation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Negotiation"

  /requirements/{requirementId}/negotiations/respond:
    post:
      operationId: respondToCounterOffer
      tags: [negotiations]
      summary: Provider accepts or declines a counter-offer
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondOfferBody"
      responses:
        "200":
          description: Updated negotiation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Negotiation"

  # PAYMENTS (UPI Escrow)
  /requirements/{requirementId}/payment:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get payment and work proofs for a requirement
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment with work proofs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWithProofs"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Initiate UPI escrow payment (mock)
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWithProofs"

  /requirements/{requirementId}/payment/submit-proof:
    post:
      operationId: submitWorkProof
      tags: [payments]
      summary: Provider submits milestone work proof
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWorkProofBody"
      responses:
        "201":
          description: Work proof submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkProof"

  /requirements/{requirementId}/payment/approve-milestone:
    post:
      operationId: approveMilestone
      tags: [payments]
      summary: Buyer approves a milestone and releases escrow portion
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMilestoneBody"
      responses:
        "200":
          description: Milestone approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkProof"

  # BIDS - Envelope A Approval
  /bids/{id}/approve-envelope-a:
    post:
      operationId: approveEnvelopeA
      tags: [bids]
      summary: Buyer approves technical bid (Envelope A), reveals financial amount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Envelope A approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /requirements/stats/{id}:
    get:
      operationId: getRequirementStats
      tags: [requirements]
      summary: Get bid stats for a requirement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementStats"

  # SETTINGS
  /settings/my:
    get:
      operationId: getMySettings
      tags: [settings]
      summary: Get authenticated user settings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      operationId: updateMySettings
      tags: [settings]
      summary: Update authenticated user settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"

  # ANALYTICS
  /analytics/events:
    post:
      operationId: trackEvent
      tags: [analytics]
      summary: Track an analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackEventBody"
      responses:
        "201":
          description: Event tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Get role-based analytics dashboard data
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"

  /analytics/admin:
    get:
      operationId: getAdminAnalytics
      tags: [analytics]
      summary: Get admin analytics (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"

  /analytics/funnel:
    get:
      operationId: getAnalyticsFunnel
      tags: [analytics]
      summary: Get platform conversion funnel
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Funnel data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStage"

  # REFERRALS
  /referrals/my:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      summary: Get my referrals and stats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Referral stats and list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralStats"

  /referrals/invite:
    post:
      operationId: inviteReferral
      tags: [referrals]
      summary: Send a referral invite
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "201":
          description: Referral created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"

  # ENTERPRISE
  /enterprise/rate-cards:
    get:
      operationId: listRateCards
      tags: [enterprise]
      summary: List enterprise rate cards
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Rate cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RateCard"
    post:
      operationId: createRateCard
      tags: [enterprise]
      summary: Create a rate card
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCardBody"
      responses:
        "201":
          description: Created rate card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCard"

  /enterprise/rate-cards/{id}:
    put:
      operationId: updateRateCard
      tags: [enterprise]
      summary: Update a rate card
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCardBody"
      responses:
        "200":
          description: Updated rate card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCard"
    delete:
      operationId: deleteRateCard
      tags: [enterprise]
      summary: Delete a rate card
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ADMIN
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide admin stats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all categories with stats (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Categories with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"

  /admin/categories/{id}/floor:
    put:
      operationId: updateCategoryFloor
      tags: [admin]
      summary: Update a category price floor
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                floor:
                  type: number
              required: [floor]
      responses:
        "200":
          description: Updated category
